[package]
name = "sbpf-mainnet-bench-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
bincode = "1.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "4.7.0"
solana-clock = "4.0.0"
solana-epoch-schedule = "3.3.0"
solana-hash = "4.6.0"
solana-instruction = "3.5.0"
solana-instructions-sysvar = "4.0.0"
solana-rent = "4.4.0"
solana-message = "4.6.0"
solana-pubkey = "4.3.0"
solana-sdk-ids = "3.1.0"
solana-svm-transaction = "5.0.0"

# Agave's runtime crates come from the pinned upstream revision, so the repo
# does not need an agave checkout next to it. Bump this and Cargo.lock together.
solana-compute-budget = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api"] }
solana-program-runtime = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api"] }
solana-svm = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api", "dev-context-only-utils", "conformance"] }
solana-svm-feature-set = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api"] }
solana-svm-log-collector = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api"] }
solana-svm-timings = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api"] }
solana-transaction-context = { git = "https://github.com/anza-xyz/agave", rev = "5b4b1218b0be841ddfa654d401d6d440444088d9", features = ["agave-unstable-api"] }

# The whole point of the benchmark: point this at whichever solana-sbpf branch is
# being measured. bench.sh swaps the checkout; agave requires exactly 0.24.0.
[patch.crates-io]
solana-sbpf = { path = "../sbpf" }
